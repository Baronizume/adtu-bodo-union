<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ADTU Bodo Union | Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .admin-page {
            min-height: 100vh;
        }

        .admin-header {
            background: #1f2937;
            color: white;
            padding: 25px 20px;
        }

        .admin-header-container {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .admin-header h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .admin-header p {
            margin: 0;
            opacity: .8;
        }

        .admin-user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #adminUser {
            font-size: 14px;
        }

        #logoutButton {
            border: none;
            background: #dc2626;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        #logoutButton:hover {
            background: #b91c1c;
        }

        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(
                    0,
                    0,
                    0,
                    .08
                );
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .event-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );
            gap: 20px;
        }

        .event-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            background: #fafafa;
        }

        .event-item h3 {
            margin-top: 0;
        }

        .event-date {
            color: #2563eb;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .event-description {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .event-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .event-actions button {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }

        .upload-description {
            color: #6b7280;
        }

        .upload-box {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            background: #fafafa;
        }

        .file-input {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px dashed #9ca3af;
        }

        .upload-status {
            margin-top: 12px;
            color: #4b5563;
        }

        .progress {
            width: 100%;
            height: 8px;
            margin-top: 10px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #16a34a;
            transition: width .2s;
        }

        .media-counts {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .count-box {
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            background: #f3f4f6;
            text-align: center;
        }

        .count-box strong {
            display: block;
            font-size: 30px;
            color: #2563eb;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        @media (max-width: 700px) {

            .admin-header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-user-area {
                width: 100%;
                justify-content: space-between;
            }

            .admin-card {
                padding: 18px;
            }

            .media-counts {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="admin-page">

    <header class="admin-header">

        <div class="admin-header-container">

            <div>

                <h1>
                    Admin Dashboard
                </h1>

                <p>
                    Manage events, photos and videos.
                </p>

            </div>

            <div class="admin-user-area">

                <span id="adminUser">
                    Checking admin...
                </span>

                <button
                    id="logoutButton"
                    type="button">

                    Logout

                </button>

            </div>

        </div>

    </header>


    <main class="admin-container">


        <!-- EVENT FORM -->

        <section class="admin-card">

            <h2 id="eventFormTitle">
                Add Event
            </h2>

            <form id="eventForm">

                <div class="form-group">

                    <label for="eventName">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        placeholder="Enter event name"
                        required>

                </div>

                <div class="form-group">

                    <label for="eventDate">
                        Event Date
                    </label>

                    <input
                        type="date"
                        id="eventDate"
                        required>

                </div>

                <div class="form-group">

                    <label for="eventDescription">
                        Event Description
                    </label>

                    <textarea
                        id="eventDescription"
                        placeholder="Enter event description"
                        required></textarea>

                </div>

                <div class="button-group">

                    <button
                        type="submit"
                        id="saveEventButton"
                        class="btn btn-primary">

                        Add Event

                    </button>

                    <button
                        type="button"
                        id="clearFormButton"
                        class="btn btn-secondary">

                        Clear

                    </button>

                </div>

                <div
                    id="formMessage"
                    class="message">
                </div>

            </form>

        </section>


        <!-- EVENTS -->

        <section class="admin-card">

            <h2>
                Events
            </h2>

            <div
                id="eventList"
                class="event-list">

                <div class="loading">
                    Loading events...
                </div>

            </div>

        </section>


        <!-- MEDIA -->

        <section class="admin-card">

            <h2>
                📁 Event Photos & Videos
            </h2>

            <p class="upload-description">
                Select an event and upload its photos or videos.
            </p>


            <div class="form-group">

                <label for="uploadEvent">
                    Select Event
                </label>

                <select id="uploadEvent">

                    <option value="">
                        Select an event
                    </option>

                </select>

            </div>


            <!-- PHOTOS -->

            <div class="upload-box">

                <h3>
                    📷 Event Photos
                </h3>

                <input
                    type="file"
                    id="photoInput"
                    class="file-input"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                    multiple>

                <br><br>

                <button
                    type="button"
                    id="uploadPhotosButton"
                    class="btn btn-success">

                    📤 Upload Photos

                </button>

                <div
                    id="photoStatus"
                    class="upload-status">

                    No photos selected.

                </div>

                <div
                    id="photoProgress"
                    class="progress">

                    <div
                        id="photoProgressBar"
                        class="progress-bar">
                    </div>

                </div>

            </div>


            <!-- VIDEOS -->

            <div class="upload-box">

                <h3>
                    🎥 Event Videos
                </h3>

                <input
                    type="file"
                    id="videoInput"
                    class="file-input"
                    accept="video/mp4,video/webm,video/quicktime,video/x-m4v"
                    multiple>

                <br><br>

                <button
                    type="button"
                    id="uploadVideosButton"
                    class="btn btn-success">

                    📤 Upload Videos

                </button>

                <div
                    id="videoStatus"
                    class="upload-status">

                    No videos selected.

                </div>

                <div
                    id="videoProgress"
                    class="progress">

                    <div
                        id="videoProgressBar"
                        class="progress-bar">
                    </div>

                </div>

            </div>


            <!-- COUNTS -->

            <div class="media-counts">

                <div class="count-box">

                    📷 Photos

                    <strong id="photoCount">
                        0
                    </strong>

                </div>

                <div class="count-box">

                    🎥 Videos

                    <strong id="videoCount">
                        0
                    </strong>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../js/firebase.js"></script>


<script>

"use strict";

// =====================================================
// CONFIGURATION
// =====================================================

const EVENTS_COLLECTION = "events";
const ADMINS_COLLECTION = "admins";

const API_URL =
    "https://adtu-bodo-union.onrender.com";

// =====================================================
// DOM
// =====================================================

const adminUser =
    document.getElementById("adminUser");

const logoutButton =
    document.getElementById("logoutButton");

const eventForm =
    document.getElementById("eventForm");

const eventFormTitle =
    document.getElementById("eventFormTitle");

const eventName =
    document.getElementById("eventName");

const eventDate =
    document.getElementById("eventDate");

const eventDescription =
    document.getElementById("eventDescription");

const saveEventButton =
    document.getElementById("saveEventButton");

const clearFormButton =
    document.getElementById("clearFormButton");

const formMessage =
    document.getElementById("formMessage");

const eventList =
    document.getElementById("eventList");

const uploadEvent =
    document.getElementById("uploadEvent");

const photoInput =
    document.getElementById("photoInput");

const videoInput =
    document.getElementById("videoInput");

const uploadPhotosButton =
    document.getElementById("uploadPhotosButton");

const uploadVideosButton =
    document.getElementById("uploadVideosButton");

const photoStatus =
    document.getElementById("photoStatus");

const videoStatus =
    document.getElementById("videoStatus");

const photoCount =
    document.getElementById("photoCount");

const videoCount =
    document.getElementById("videoCount");

const photoProgress =
    document.getElementById("photoProgress");

const videoProgress =
    document.getElementById("videoProgress");

const photoProgressBar =
    document.getElementById("photoProgressBar");

const videoProgressBar =
    document.getElementById("videoProgressBar");

// =====================================================
// STATE
// =====================================================

let editingEventId = null;

// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    element,
    message,
    type
) {

    element.textContent =
        message;

    element.className =
        "message " + type;
}

function clearMessage(element) {

    element.textContent =
        "";

    element.className =
        "message";
}

// =====================================================
// RESET
// =====================================================

function resetEventForm() {

    editingEventId =
        null;

    eventForm.reset();

    eventFormTitle.textContent =
        "Add Event";

    saveEventButton.textContent =
        "Add Event";

    clearMessage(
        formMessage
    );
}

// =====================================================
// CHECK API
// =====================================================

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_URL +
                "/health"
            );

        if (!response.ok) {

            throw new Error(
                "Backend returned HTTP " +
                response.status
            );
        }

        const result =
            await response.json();

        console.log(
            "Backend connected:",
            result
        );

        return true;

    } catch (error) {

        console.error(
            "Backend connection failed:",
            error
        );

        return false;
    }
}

// =====================================================
// CHECK ADMIN
// =====================================================

async function checkAdmin(user) {

    if (!user) {

        window.location.replace(
            "/admin/login"
        );

        return false;
    }

    try {

        const adminDocument =
            await db
                .collection(
                    ADMINS_COLLECTION
                )
                .doc(
                    user.uid
                )
                .get();

        if (
            !adminDocument.exists
        ) {

            alert(
                "You are not authorized to access the admin dashboard."
            );

            await auth.signOut();

            window.location.replace(
                "/admin/login"
            );

            return false;
        }

        const adminData =
            adminDocument.data();

        if (
            adminData.role &&
            adminData.role !== "admin"
        ) {

            alert(
                "You are not authorized to access the admin dashboard."
            );

            await auth.signOut();

            window.location.replace(
                "/admin/login"
            );

            return false;
        }

        adminUser.textContent =
            user.email ||
            "Admin";

        return true;

    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        adminUser.textContent =
            "Verification failed";

        alert(
            "Unable to verify admin account."
        );

        return false;
    }
}

// =====================================================
// AUTH
// =====================================================

auth.onAuthStateChanged(
    async function (user) {

        const isAdmin =
            await checkAdmin(
                user
            );

        if (!isAdmin) {
            return;
        }

        const backendOnline =
            await checkBackend();

        if (!backendOnline) {

            console.warn(
                "Backend is not reachable. Uploads will not work."
            );
        }

        await loadEvents();
    }
);

// =====================================================
// LOGOUT
// =====================================================

logoutButton.addEventListener(
    "click",
    async function () {

        logoutButton.disabled =
            true;

        try {

            await auth.signOut();

            window.location.replace(
                "/admin/login"
            );

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

            logoutButton.disabled =
                false;

            alert(
                "Unable to logout."
            );
        }
    }
);

// =====================================================
// LOAD EVENTS
// =====================================================

async function loadEvents() {

    eventList.innerHTML =
        `<div class="loading">
            Loading events...
        </div>`;

    try {

        let snapshot;

        try {

            snapshot =
                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .orderBy(
                        "date",
                        "desc"
                    )
                    .get();

        } catch (error) {

            console.warn(
                "Ordered query failed. Trying normal query.",
                error
            );

            snapshot =
                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .get();
        }

        const events = [];

        snapshot.forEach(
            function (document) {

                events.push({

                    id:
                        document.id,

                    ...document.data()

                });
            }
        );

        events.sort(
            function (a, b) {

                return String(
                    b.date || ""
                ).localeCompare(
                    String(
                        a.date || ""
                    )
                );
            }
        );

        displayEvents(
            events
        );

        populateEventDropdown(
            events
        );

    } catch (error) {

        console.error(
            "Load events error:",
            error
        );

        eventList.innerHTML =
            `<div class="message error">
                Failed to load events.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>`;
    }
}

// =====================================================
// DISPLAY EVENTS
// =====================================================

function displayEvents(events) {

    if (
        events.length === 0
    ) {

        eventList.innerHTML =
            `<div class="loading">
                No events found.
            </div>`;

        return;
    }

    eventList.innerHTML =
        "";

    events.forEach(
        function (event) {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "event-item";

            item.innerHTML = `

                <h3>
                    ${escapeHtml(
                        event.name
                    )}
                </h3>

                <div class="event-date">
                    ${escapeHtml(
                        event.date ||
                        "No date"
                    )}
                </div>

                <div class="event-description">
                    ${escapeHtml(
                        event.description ||
                        "No description"
                    )}
                </div>

                <div class="event-actions">

                    <button
                        class="view-btn"
                        data-action="view">

                        View

                    </button>

                    <button
                        class="edit-btn"
                        data-action="edit">

                        Edit

                    </button>

                    <button
                        class="delete-btn"
                        data-action="delete">

                        Delete

                    </button>

                </div>
            `;

            item
                .querySelector(
                    '[data-action="view"]'
                )
                .addEventListener(
                    "click",
                    function () {

                        viewEvent(
                            event.id
                        );
                    }
                );

            item
                .querySelector(
                    '[data-action="edit"]'
                )
                .addEventListener(
                    "click",
                    function () {

                        editEvent(
                            event.id
                        );
                    }
                );

            item
                .querySelector(
                    '[data-action="delete"]'
                )
                .addEventListener(
                    "click",
                    function () {

                        deleteEvent(
                            event.id
                        );
                    }
                );

            eventList.appendChild(
                item
            );
        }
    );
}

// =====================================================
// DROPDOWN
// =====================================================

function populateEventDropdown(
    events
) {

    uploadEvent.innerHTML =
        `<option value="">
            Select an event
        </option>`;

    events.forEach(
        function (event) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                event.id;

            option.textContent =
                event.name;

            uploadEvent.appendChild(
                option
            );
        }
    );
}

// =====================================================
// ADD / EDIT EVENT
// =====================================================

eventForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const name =
            eventName.value.trim();

        const date =
            eventDate.value;

        const description =
            eventDescription.value.trim();

        if (
            !name ||
            !date ||
            !description
        ) {

            showMessage(
                formMessage,
                "Please fill in all fields.",
                "error"
            );

            return;
        }

        saveEventButton.disabled =
            true;

        try {

            if (editingEventId) {

                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .doc(
                        editingEventId
                    )
                    .update({

                        name:
                            name,

                        date:
                            date,

                        description:
                            description,

                        updatedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()
                    });

                showMessage(
                    formMessage,
                    "Event updated successfully.",
                    "success"
                );

            } else {

                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .add({

                        name:
                            name,

                        date:
                            date,

                        description:
                            description,

                        createdAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        updatedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()
                    });

                showMessage(
                    formMessage,
                    "Event added successfully.",
                    "success"
                );
            }

            resetEventForm();

            await loadEvents();

        } catch (error) {

            console.error(
                "Save event error:",
                error
            );

            showMessage(
                formMessage,
                "Failed to save event: " +
                error.message,
                "error"
            );

        } finally {

            saveEventButton.disabled =
                false;
        }
    }
);

// =====================================================
// CLEAR
// =====================================================

clearFormButton.addEventListener(
    "click",
    resetEventForm
);

// =====================================================
// EDIT EVENT
// =====================================================

async function editEvent(
    eventId
) {

    try {

        const document =
            await db
                .collection(
                    EVENTS_COLLECTION
                )
                .doc(
                    eventId
                )
                .get();

        if (
            !document.exists
        ) {

            alert(
                "Event not found."
            );

            return;
        }

        const event =
            document.data();

        editingEventId =
            eventId;

        eventName.value =
            event.name || "";

        eventDate.value =
            event.date || "";

        eventDescription.value =
            event.description || "";

        eventFormTitle.textContent =
            "Edit Event";

        saveEventButton.textContent =
            "Update Event";

        clearMessage(
            formMessage
        );

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        console.error(
            "Edit event error:",
            error
        );

        alert(
            "Unable to load event."
        );
    }
}

// =====================================================
// DELETE EVENT
// =====================================================

async function deleteEvent(
    eventId
) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this event?"
        );

    if (!confirmed) {
        return;
    }

    try {

        await db
            .collection(
                EVENTS_COLLECTION
            )
            .doc(
                eventId
            )
            .delete();

        if (
            editingEventId ===
            eventId
        ) {

            resetEventForm();
        }

        await loadEvents();

        alert(
            "Event deleted successfully."
        );

    } catch (error) {

        console.error(
            "Delete event error:",
            error
        );

        alert(
            "Failed to delete event: " +
            error.message
        );
    }
}

// =====================================================
// VIEW EVENT
// =====================================================

function viewEvent(
    eventId
) {

    window.location.href =

        encodeURIComponent(

        );
}

// =====================================================
// UPLOAD FUNCTION
// =====================================================

async function uploadFiles(
    endpoint,
    fieldName,
    files,
    eventId,
    button,
    statusElement,
    inputElement,
    progressElement,
    progressBar,
    type
) {

    const formData =
        new FormData();

    formData.append(
        "eventId",
        eventId
    );

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        formData.append(
            fieldName,
            files[i]
        );
    }

    button.disabled =
        true;

    progressElement.style.display =
        "block";

    progressBar.style.width =
        "0%";

    statusElement.textContent =
        `Uploading ${files.length} ${type}(s)...`;

    try {

        const result =
            await uploadWithProgress(
                endpoint,
                formData,
                function (percent) {

                    progressBar.style.width =
                        percent + "%";
                }
            );

        if (
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Upload failed."
            );
        }

        statusElement.textContent =
            result.message ||
            "Upload successful.";

        inputElement.value =
            "";

        await loadMediaCounts(
            eventId
        );

    } catch (error) {

        console.error(
            `${type} upload error:`,
            error
        );

        statusElement.textContent =
            `Upload failed: ${error.message}`;

    } finally {

        button.disabled =
            false;

        setTimeout(
            function () {

                progressElement.style.display =
                    "none";

                progressBar.style.width =
                    "0%";

            },
            1000
        );
    }
}

// =====================================================
// UPLOAD WITH PROGRESS
// =====================================================

function uploadWithProgress(
    endpoint,
    formData,
    onProgress
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const xhr =
                new XMLHttpRequest();

            xhr.open(
                "POST",
                API_URL +
                endpoint,
                true
            );

            xhr.upload.addEventListener(
                "progress",
                function (event) {

                    if (
                        event.lengthComputable
                    ) {

                        const percent =
                            Math.round(
                                (
                                    event.loaded /
                                    event.total
                                ) *
                                100
                            );

                        onProgress(
                            percent
                        );
                    }
                }
            );

            xhr.onload =
                function () {

                    let result;

                    try {

                        result =
                            JSON.parse(
                                xhr.responseText
                            );

                    } catch (error) {

                        reject(
                            new Error(
                                "Invalid server response."
                            )
                        );

                        return;
                    }

                    if (
                        xhr.status >= 200 &&
                        xhr.status < 300
                    ) {

                        resolve(
                            result
                        );

                    } else {

                        reject(
                            new Error(
                                result.message ||
                                `Server error: ${xhr.status}`
                            )
                        );
                    }
                };

            xhr.onerror =
                function () {

                    reject(
                        new Error(
                            "Network error. Please check the backend server."
                        )
                    );
                };

            xhr.ontimeout =
                function () {

                    reject(
                        new Error(
                            "Upload timed out."
                        )
                    );
                };

            xhr.timeout =
                30 * 60 * 1000;

            xhr.send(
                formData
            );
        }
    );
}

// =====================================================
// MEDIA COUNTS
// =====================================================

async function loadMediaCounts(
    eventId
) {

    try {

        const response =
            await fetch(
                API_URL +
                "/api/upload/event/" +
                encodeURIComponent(
                    eventId
                )
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Unable to load media."
            );
        }

        photoCount.textContent =
            result.photoCount || 0;

        videoCount.textContent =
            result.videoCount || 0;

    } catch (error) {

        console.error(
            "Media count error:",
            error
        );

        photoCount.textContent =
            "0";

        videoCount.textContent =
            "0";
    }
}
