<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ADTU Bodo Union | Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header,
        .admin-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
        }

        .admin-user {
            color: #666;
            margin: 0;
        }

        .logout-button {
            background: #c62828;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #a91f1f;
        }

        .admin-card {
            padding: 30px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .primary-button {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .primary-button:hover {
            background: #1558b0;
        }

        .primary-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #eee;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 8px;
        }

        .event-list {
            display: grid;
            gap: 15px;
        }

        .event-item {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
        }

        .event-item h3 {
            margin-top: 0;
        }

        .event-date {
            color: #666;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .view-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-button {
            background: #c62828;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        /* =========================
           MEDIA UPLOAD BOX
        ========================== */

        .media-upload-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9ff;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .media-upload-box h4 {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .upload-group {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }

        .upload-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .upload-group input {
            width: 100%;
            box-sizing: border-box;
        }

        .upload-button {
            width: 100%;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        .photo-upload-button {
            background: #7b1fa2;
        }

        .video-upload-button {
            background: #00897b;
        }

        .upload-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =========================
           MEDIA COUNT
        ========================== */

        .media-count {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding: 14px;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            font-weight: 700;
        }

        .photo-count {
            color: #7b1fa2;
        }

        .video-count {
            color: #00897b;
        }

        .upload-status {
            min-height: 22px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #c62828;
        }

        .loading {
            color: #666;
        }

        .status-message {
            min-height: 20px;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header button {
                width: 100%;
            }

            .upload-row {
                grid-template-columns: 1fr;
            }

            .secondary-button {
                margin-left: 0;
                margin-top: 10px;
            }

            .media-count {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="../index.html" class="brand">

            <div class="brand-logo">
                ABU
            </div>

            <div class="brand-text">
                <strong>ADTU BODO UNION</strong>
                <span>Event &amp; Photo Hub</span>
            </div>

        </a>

    </div>

</header>


<main class="admin-page">

    <!-- ADMIN HEADER -->

    <section class="admin-header">

        <div>

            <h1>🔐 Admin Dashboard</h1>

            <p id="adminUser" class="admin-user">
                Checking admin access...
            </p>

        </div>

        <button
            id="logoutButton"
            class="logout-button"
            type="button">

            🚪 Logout

        </button>

    </section>


    <!-- ADD EVENT -->

    <section class="admin-card">

        <h2>Add Event</h2>

        <p>Create a new ADTU Bodo Union event.</p>

        <form id="eventForm">

            <div class="form-group">

                <label for="eventName">
                    Event Name
                </label>

                <input
                    id="eventName"
                    type="text"
                    placeholder="Enter event name"
                    required>

            </div>


            <div class="form-group">

                <label for="eventDate">
                    Event Date
                </label>

                <input
                    id="eventDate"
                    type="date"
                    required>

            </div>


            <div class="form-group">

                <label for="eventDescription">
                    Description
                </label>

                <textarea
                    id="eventDescription"
                    placeholder="Enter event description">
                </textarea>

            </div>


            <div class="form-group">

                <label for="photosLink">
                    Photos Link
                </label>

                <input
                    id="photosLink"
                    type="url"
                    placeholder="Optional Google Drive link">

            </div>


            <div class="form-group">

                <label for="videosLink">

                </label>

            </div>

            </p>

    </section>

</main>


<footer>

    <div class="footer-container">

        <div>

            <strong>
                ADTU BODO UNION
            </strong>

            <p>
                Event &amp; Photo Hub
            </p>

        </div>

        <p>
            © <span id="year"></span>
            ADTU Bodo Union
        </p>

    </div>

</footer>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="../js/firebase.js"></script>


<script>

const eventForm =
    document.getElementById("eventForm");

const eventName =
    document.getElementById("eventName");

const eventDate =
    document.getElementById("eventDate");

const eventDescription =
    document.getElementById("eventDescription");

const photosLink =
    document.getElementById("photosLink");

const videosLink =
    document.getElementById("videosLink");

const eventList =
    document.getElementById("eventList");

const adminUser =
    document.getElementById("adminUser");

const logoutButton =
    document.getElementById("logoutButton");

const formMessage =
    document.getElementById("formMessage");

const saveEventButton =
    document.getElementById("saveEventButton");

const clearFormButton =
    document.getElementById("clearFormButton");

const yearElement =
    document.getElementById("year");


/* =========================
   FOOTER YEAR
========================= */

yearElement.textContent =
    new Date().getFullYear();


/* =========================
   ADMIN CHECK
========================= */

async function verifyAdmin(user) {

    if (!user) {
        return false;
    }

    try {

        const adminDoc =
            await db
                .collection("admins")
                .doc(user.uid)
                .get();

        if (!adminDoc.exists) {
            return false;
        }

        const data =
            adminDoc.data();

        return (
            !data.role ||
            data.role === "admin"
        );

    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        return false;
    }
}


/* =========================
   AUTH
========================= */

auth.onAuthStateChanged(
    async function(user) {

        if (!user) {

            window.location.replace(
                "login.html"
            );

            return;
        }

        const admin =
            await verifyAdmin(user);

        if (!admin) {

            await auth.signOut();

            window.location.replace(
                "login.html"
            );

            return;
        }

        adminUser.textContent =
            "Logged in as: " +
            (user.email || "Administrator");

        loadEvents();
    }
);


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
    "click",
    async function() {

        await auth.signOut();

        window.location.replace(
            "login.html"
        );
    }
);


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    eventForm.reset();

    eventForm.removeAttribute(
        "data-edit-id"
    );

    saveEventButton.textContent =
        "➕ Add Event";

    formMessage.textContent =
        "";

    formMessage.className =
        "status-message";
}


clearFormButton.addEventListener(
    "click",
    clearForm
);


/* =========================
   ADD / UPDATE EVENT
========================= */

eventForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const user =
            auth.currentUser;

        if (!await verifyAdmin(user)) {

            formMessage.textContent =
                "You are not authorized.";

            formMessage.className =
                "status-message error";

            return;
        }

        const data = {

            name:
                eventName.value.trim(),

            date:
                eventDate.value,

            description:
                eventDescription.value.trim(),

            photosLink:
                photosLink.value.trim(),

            videosLink:
                videosLink.value.trim(),

            updatedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()
        };


        if (!data.name || !data.date) {

            formMessage.textContent =
                "Event name and date are required.";

            formMessage.className =
                "status-message error";

            return;
        }


        const editId =
            eventForm.getAttribute(
                "data-edit-id"
            );


        saveEventButton.disabled =
            true;

        saveEventButton.textContent =
            editId
                ? "Updating..."
                : "Adding...";


        try {

            if (editId) {

                await db
                    .collection("events")
                    .doc(editId)
                    .update(data);

                formMessage.textContent =
                    "Event updated successfully.";

            } else {

                data.createdAt =
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp();

                await db
                    .collection("events")
                    .add(data);

                formMessage.textContent =
                    "Event added successfully.";
            }


            formMessage.className =
                "status-message success";


            clearForm();

            await loadEvents();

        } catch (error) {

            console.error(
                "Save error:",
                error
            );

            formMessage.textContent =
                "Could not save the event.";

            formMessage.className =
                "status-message error";
        }


        saveEventButton.disabled =
            false;
    }
);


/* =========================
   LOAD EVENTS
========================= */

async function loadEvents() {

    eventList.innerHTML =
        '<p class="loading">Loading events...</p>';

    try {

        const snapshot =
            await db
                .collection("events")
                .orderBy("date", "desc")
                .get();


        eventList.innerHTML = "";


        if (snapshot.empty) {

            eventList.innerHTML =
                "<p>No events found.</p>";

            return;
        }


        snapshot.forEach(
            function(doc) {

                const data =
                    doc.data();

                createEventItem(
                    doc.id,
                    data
                );
            }
        );

    } catch (error) {

        console.error(
            "Load events error:",
            error
        );

        eventList.innerHTML =
            '<p class="error">Could not load events.</p>';
    }
}


/* =========================
   CREATE EVENT ITEM
========================= */

function createEventItem(
    id,
    data
) {

    const item =
        document.createElement("div");

    item.className =
        "event-item";


    const title =
        document.createElement("h3");

    title.textContent =
        data.name || "Untitled Event";


    const date =
        document.createElement("p");

    date.className =
        "event-date";

    date.textContent =
        "📅 " +
        formatDate(data.date);


    const description =
        document.createElement("p");

    description.textContent =
        data.description || "No description.";


    /* =========================
       ACTIONS
    ========================== */

    const actions =
        document.createElement("div");

    actions.className =
        "event-actions";


    const viewButton =
        document.createElement("a");

    viewButton.className =
        "view-button";

    viewButton.textContent =
        "👁️ View Event";

    viewButton.href =
        "../events/event.html?id=" +

        encodeURIComponent(id);


    const editButton =
        document.createElement("button");

    editButton.type =
        "button";

    editButton.className =
        "edit-button";

    editButton.textContent =
        "✏️ Edit";

    editButton.addEventListener(
        "click",
        function() {

            editEvent(
                id,
                data
            );
        }
    );


    const deleteButton =
        document.createElement("button");

    deleteButton.type =
        "button";

    deleteButton.className =
        "delete-button";

    deleteButton.textContent =
        "🗑️ Delete";

    deleteButton.addEventListener(
        "click",
        function() {

            deleteEvent(
                id,
                data.name
            );
        }
    );


    actions.appendChild(viewButton);
    actions.appendChild(editButton);
    actions.appendChild(deleteButton);


    item.appendChild(title);
    item.appendChild(date);
    item.appendChild(description);
    item.appendChild(actions);


    /* =========================
       UPLOAD BOX
    ========================== */

    createUploadBox(
        id,
        item
    );


    eventList.appendChild(item);
}


/* =========================
   UPLOAD BOX
========================= */

function createUploadBox(
    eventId,
    eventItem
) {

    const box =
        document.createElement("div");

    box.className =
        "media-upload-box";


    const title =
        document.createElement("h4");

    title.textContent =
        "📷🎥 Upload Event Media";


    const row =
        document.createElement("div");

    row.className =
        "upload-row";


    /* =========================
       PHOTO GROUP
    ========================== */

    const photoGroup =
        document.createElement("div");

    photoGroup.className =
        "upload-group";


    const photoLabel =
        document.createElement("label");

    photoLabel.textContent =
        "📷 Photos";


    const photoInput =
        document.createElement("input");

    photoInput.type =
        "file";

    photoInput.accept =
        "image/*";

    photoInput.multiple =
        true;


    const photoButton =
        document.createElement("button");

    photoButton.type =
        "button";

    photoButton.className =
        "upload-button photo-upload-button";

    photoButton.textContent =
        "📷 Upload Photos";


    photoGroup.appendChild(photoLabel);
    photoGroup.appendChild(photoInput);
    photoGroup.appendChild(photoButton);


    /* =========================
       VIDEO GROUP
    ========================== */

    const videoGroup =
        document.createElement("div");

    videoGroup.className =
        "upload-group";


    const videoLabel =
        document.createElement("label");

    videoLabel.textContent =
        "🎥 Videos";


    const videoInput =
        document.createElement("input");

    videoInput.type =
        "file";

    videoInput.accept =
        "video/*";

    videoInput.multiple =
        true;


    const videoButton =
        document.createElement("button");

    videoButton.type =
        "button";

    videoButton.className =
        "upload-button video-upload-button";

    videoButton.textContent =
        "🎥 Upload Videos";


    videoGroup.appendChild(videoLabel);
    videoGroup.appendChild(videoInput);
    videoGroup.appendChild(videoButton);


    row.appendChild(photoGroup);
    row.appendChild(videoGroup);


    /* =========================
       COUNT
    ========================== */

    const count =
        document.createElement("div");

    count.className =
        "media-count";


    const photoCount =
        document.createElement("span");

    photoCount.className =
        "photo-count";

    photoCount.textContent =
        "📷 Photos: 0";


    const videoCount =
        document.createElement("span");

    videoCount.className =
        "video-count";

    videoCount.textContent =
        "🎥 Videos: 0";


    count.appendChild(photoCount);
    count.appendChild(videoCount);


    /* =========================
       STATUS
    ========================== */

    const status =
        document.createElement("div");

    status.className =
        "upload-status";


    /* =========================
       PHOTO UPLOAD
    ========================== */

    photoButton.addEventListener(
        "click",
        async function() {

            const files =
                Array.from(
                    photoInput.files
                );

            if (!files.length) {

                status.textContent =
                    "Please select photos first.";

                status.className =
                    "upload-status error";

                return;
            }


            await uploadFiles(
                eventId,
                files,
                "photos",
                photoButton,
                status
            );


            photoInput.value = "";

            await updateCounts(
                eventId,
                photoCount,
                videoCount
            );
        }
    );


    /* =========================
       VIDEO UPLOAD
    ========================== */

    videoButton.addEventListener(
        "click",
        async function() {

            const files =
                Array.from(
                    videoInput.files
                );

            if (!files.length) {

                status.textContent =
                    "Please select videos first.";

                status.className =
                    "upload-status error";

                return;
            }


            await uploadFiles(
                eventId,
                files,
                "videos",
                videoButton,
                status
            );


            videoInput.value = "";

            await updateCounts(
                eventId,
                photoCount,
                videoCount
            );
        }
    );


    box.appendChild(title);
    box.appendChild(row);
    box.appendChild(count);
    box.appendChild(status);


    eventItem.appendChild(box);


    updateCounts(
        eventId,
        photoCount,
        videoCount
    );
}


/* =========================
   UPLOAD FILES TO FIREBASE
========================= */

async function uploadFiles(
    eventId,
    files,
    type,
    button,
    status
) {

    const user =
        auth.currentUser;


    if (!await verifyAdmin(user)) {

        status.textContent =
            "You are not authorized.";

        status.className =
            "upload-status error";

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Uploading...";


    try {

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            const file =
                files[i];


            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );


            const filePath =
                "events/" +
                eventId +
                "/" +
                type +
                "/" +
                Date.now() +
                "_" +
                i +
                "_" +
                safeName;


            const storageRef =
                storage
                    .ref()
                    .child(filePath);


            await storageRef.put(file);


            const downloadURL =
                await storageRef.getDownloadURL();


            await db
                .collection("events")
                .doc(eventId)
                .collection(type)
                .add({

                    name:
                        file.name,

                    url:
                        downloadURL,

                    path:
                        filePath,

                    uploadedAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()
                });


            status.textContent =
                "Uploaded " +
                (i + 1) +
                " of " +
                files.length +
                " " +
                type;
        }


        status.textContent =
            "✅ " +
            files.length +
            " " +
            type +
            " uploaded successfully.";

        status.className =
            "upload-status success";


    } catch (error) {

        console.error(
            "Upload error:",
            error
        );

        status.textContent =
            "❌ Upload failed: " +
            (error.message || "Unknown error");

        status.className =
            "upload-status error";

    }


    button.disabled =
        false;


    button.textContent =
        type === "photos"
            ? "📷 Upload Photos"
            : "🎥 Upload Videos";
}


/* =========================
   COUNT MEDIA
========================= */

async function updateCounts(
    eventId,
    photoElement,
    videoElement
) {

    try {

        const photos =
            await db
                .collection("events")
                .doc(eventId)
                .collection("photos")
                .get();


        const videos =
            await db
                .collection("events")
                .doc(eventId)
                .collection("videos")
                .get();


        photoElement.textContent =
            "📷 Photos: " +
            photos.size;


        videoElement.textContent =
            "🎥 Videos: " +
            videos.size;


    } catch (error) {

        console.error(
            "Count error:",
            error
        );

        photoElement.textContent =
            "📷 Photos: 0";

        videoElement.textContent =
            "🎥 Videos: 0";
    }
}


/* =========================
   EDIT EVENT
========================= */

function editEvent(
    id,
    data
) {

    eventName.value =
        data.name || "";

    eventDate.value =
        data.date || "";

    eventDescription.value =
        data.description || "";

    photosLink.value =
        data.photosLink || "";

    videosLink.value =
        data.videosLink || "";


    eventForm.setAttribute(
        "data-edit-id",
        id
    );


    saveEventButton.textContent =
        "💾 Update Event";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================
   DELETE EVENT
========================= */

async function deleteEvent(
    id,
    name
) {

    const user =
        auth.currentUser;


    if (!await verifyAdmin(user)) {

        alert(
            "You are not authorized."
        );

        return;
    }


    const confirmed =
        window.confirm(
            'Are you sure you want to delete "' +
            (name || "this event") +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    try {

        await db
            .collection("events")
            .doc(id)
            .delete();


        alert(
            "Event deleted successfully."
        );


        await loadEvents();


    } catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Could not delete the event."
        );
    }
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString) {

    if (!dateString) {
        return "Date not available";
    }


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    if (isNaN(date.getTime())) {
        return dateString;
    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}
