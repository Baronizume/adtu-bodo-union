<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ADTU Bodo Union | Admin Dashboard
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        /* =========================================
           ADMIN PAGE
        ========================================= */

        .admin-page {

            max-width: 1100px;

            margin: 0 auto;

            padding: 40px 20px;

        }


        .admin-header,
        .admin-card {

            background: #fff;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, .08);

        }


        .admin-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;

            padding: 25px;

        }


        .admin-header h1 {

            margin: 0 0 8px;

        }


        .admin-user {

            color: #666;

            margin: 0;

        }


        /* =========================================
           LOGOUT
        ========================================= */

        .logout-button {

            background: #c62828;

            color: white;

            border: 0;

            border-radius: 8px;

            padding: 12px 18px;

            cursor: pointer;

            font-weight: 600;

        }


        .logout-button:hover {

            background: #a91f1f;

        }


        /* =========================================
           CARDS
        ========================================= */

        .admin-card {

            padding: 30px;

            margin-bottom: 25px;

        }


        .admin-card h2 {

            margin-top: 0;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

        }


        .form-group textarea {

            min-height: 120px;

            resize: vertical;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .primary-button,
        .secondary-button {

            border: none;

            border-radius: 8px;

            padding: 13px 20px;

            cursor: pointer;

            font-weight: 600;

        }


        .primary-button {

            background: #1f6feb;

            color: white;

        }


        .primary-button:hover {

            background: #1558b0;

        }


        .primary-button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .secondary-button {

            background: #eee;

            color: #333;

            margin-left: 8px;

        }


        /* =========================================
           EVENT LIST
        ========================================= */

        .event-list {

            display: grid;

            gap: 18px;

        }


        .event-item {

            border: 1px solid #eee;

            border-radius: 12px;

            padding: 20px;

        }


        .event-item h3 {

            margin-top: 0;

            margin-bottom: 8px;

        }


        .event-date {

            color: #666;

        }


        .event-description {

            line-height: 1.6;

        }


        /* =========================================
           EVENT ACTIONS
        ========================================= */

        .event-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 15px;

        }


        .view-button,
        .edit-button,
        .delete-button {

            border: none;

            padding: 10px 14px;

            border-radius: 7px;

            cursor: pointer;

            text-decoration: none;

            font-weight: 600;

            display: inline-block;

        }


        .view-button {

            background: #2563eb;

            color: white;

        }


        .edit-button {

            background: #f59e0b;

            color: white;

        }


        .delete-button {

            background: #c62828;

            color: white;

        }


        /* =========================================
           MEDIA UPLOAD
        ========================================= */

        .media-upload-box {

            margin-top: 25px;

            padding: 22px;

            background: #f8f9ff;

            border: 1px solid #ddd;

            border-radius: 12px;

        }


        .media-upload-box h4 {

            margin: 0 0 8px;

            font-size: 19px;

        }


        .media-help {

            color: #666;

            line-height: 1.5;

            margin-bottom: 18px;

        }


        /* =========================================
           TWO PARTITIONS
        ========================================= */

        .media-upload-partitions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .media-partition {

            padding: 20px;

            border-radius: 12px;

            background: white;

            border: 1px solid #ddd;

        }


        .photo-partition {

            border-top:
                5px solid #7b1fa2;

        }


        .video-partition {

            border-top:
                5px solid #00897b;

        }


        .media-partition h5 {

            margin: 0 0 8px;

            font-size: 18px;

        }


        .media-partition p {

            color: #666;

            font-size: 14px;

            line-height: 1.5;

        }


        /* =========================================
           FILE INPUT
        ========================================= */

        .media-file-input {

            width: 100%;

            box-sizing: border-box;

            margin: 12px 0;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 7px;

            background: #fafafa;

        }


        /* =========================================
           UPLOAD BUTTON
        ========================================= */

        .media-upload-button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 12px;

            cursor: pointer;

            font-weight: 600;

            color: white;

        }


        .photo-upload-button {

            background: #7b1fa2;

        }


        .photo-upload-button:hover {

            background: #641681;

        }


        .video-upload-button {

            background: #00897b;

        }


        .video-upload-button:hover {

            background: #00695c;

        }


        .media-upload-button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        /* =========================================
           STATUS
        ========================================= */

        .media-status {

            margin-top: 12px;

            min-height: 20px;

            font-size: 14px;

            font-weight: 600;

        }


        .success {

            color: #2e7d32;

        }


        .error {

            color: #c62828;

        }


        .loading {

            color: #666;

        }


        /* =========================================
           MEDIA COUNT
        ========================================= */

        .media-count {

            display: flex;

            gap: 25px;

            flex-wrap: wrap;

            margin-top: 20px;

            padding: 14px;

            background: white;

            border-radius: 8px;

            border: 1px solid #eee;

            font-weight: 700;

        }


        .photo-count {

            color: #7b1fa2;

        }


        .video-count {

            color: #00897b;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (
            max-width: 700px
        ) {

            .admin-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .admin-header button {

                width: 100%;

            }


            .secondary-button {

                margin-left: 0;

                margin-top: 10px;

            }


            .media-upload-partitions {

                grid-template-columns:
                    1fr;

            }


            .media-count {

                flex-direction: column;

                gap: 8px;

            }

        }

    </style>

</head>


<body>

<!-- =========================================
     FIREBASE
========================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../js/firebase.js"></script>


<script>


// =================================================
// CONFIGURATION
// =================================================

const EVENTS_COLLECTION =
    "events";

const API_URL =
    "http://localhost:5000";


// =================================================
// DOM
// =================================================

const eventForm =
    document.getElementById(
        "eventForm"
    );

const eventName =
    document.getElementById(
        "eventName"
    );

const eventDate =
    document.getElementById(
        "eventDate"
    );

const eventDescription =
    document.getElementById(
        "eventDescription"
    );

const eventList =
    document.getElementById(
        "eventList"
    );

const adminUser =
    document.getElementById(
        "adminUser"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const saveEventButton =
    document.getElementById(
        "saveEventButton"
    );

const clearFormButton =
    document.getElementById(
        "clearFormButton"
    );

const formMessage =
    document.getElementById(
        "formMessage"
    );


document.getElementById(
    "year"
).textContent =
    new Date().getFullYear();


// =================================================
// VERIFY ADMIN
// =================================================

async function verifyAdmin(
    user
) {

    if (!user) {

        return false;

    }


    try {

        const adminDoc =
            await db
                .collection("admins")
                .doc(user.uid)
                .get();


        if (!adminDoc.exists) {

            return false;

        }


        const data =
            adminDoc.data();


        return (
            !data.role ||
            data.role === "admin"
        );


    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        return false;

    }

}


// =================================================
// AUTH
// =================================================

auth.onAuthStateChanged(
    async function(user) {


        if (!user) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        const admin =
            await verifyAdmin(
                user
            );


        if (!admin) {

            await auth.signOut();

            window.location.replace(
                "login.html"
            );

            return;

        }


        adminUser.textContent =
            "Logged in as: " +
            (
                user.email ||
                "Administrator"
            );


        loadEvents();

    }
);


// =================================================
// LOGOUT
// =================================================

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            await auth.signOut();

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

        }


        window.location.replace(
            "login.html"
        );

    }
);


// =================================================
// CLEAR FORM
// =================================================

function clearForm() {

    eventForm.reset();


    eventForm.removeAttribute(
        "data-edit-id"
    );


    saveEventButton.textContent =
        "➕ Add Event";


    formMessage.textContent =
        "";


    formMessage.className =
        "media-status";

}


clearFormButton.addEventListener(
    "click",
    clearForm
);


// =================================================
// ADD / UPDATE EVENT
// =================================================

eventForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        const user =
            auth.currentUser;


        if (
            !await verifyAdmin(user)
        ) {

            formMessage.textContent =
                "You are not authorized.";

            formMessage.className =
                "media-status error";

            return;

        }


        const name =
            eventName.value.trim();


        const date =
            eventDate.value;


        const description =
            eventDescription.value.trim();


        if (
            !name ||
            !date
        ) {

            formMessage.textContent =
                "Event name and date are required.";

            formMessage.className =
                "media-status error";

            return;

        }


        const editId =
            eventForm.getAttribute(
                "data-edit-id"
            );


        saveEventButton.disabled =
            true;


        saveEventButton.textContent =
            editId
                ? "Updating..."
                : "Adding...";


        const data = {

            name:
                name,

            date:
                date,

            description:
                description,

            updatedAt:
                firebase.firestore
                    .FieldValue
                    .serverTimestamp()

        };


        try {

            if (editId) {

                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .doc(editId)
                    .update(
                        data
                    );


                formMessage.textContent =
                    "✅ Event updated successfully.";

            } else {

                data.createdAt =
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp();


                await db
                    .collection(
                        EVENTS_COLLECTION
                    )
                    .add(
                        data
                    );


                formMessage.textContent =
                    "✅ Event added successfully.";

            }


            formMessage.className =
                "media-status success";


            clearForm();


            await loadEvents();


        } catch (error) {

            console.error(
                "Save event error:",
                error
            );


            formMessage.textContent =
                "❌ Could not save the event.";

            formMessage.className =
                "media-status error";

        }


        saveEventButton.disabled =
            false;


        saveEventButton.textContent =
            "➕ Add Event";

    }
);


// =================================================
// LOAD EVENTS
// =================================================

async function loadEvents() {

    eventList.innerHTML =
        '<p class="loading">Loading events...</p>';


    try {

        const snapshot =
            await db
                .collection(
                    EVENTS_COLLECTION
                )
                .orderBy(
                    "date",
                    "desc"
                )
                .get();


        eventList.innerHTML =
            "";


        if (snapshot.empty) {

            eventList.innerHTML =
                "<p>No events found.</p>";

            return;

        }


        snapshot.forEach(
            function(doc) {

                createEventItem(
                    doc.id,
                    doc.data()
                );

            }
        );


    } catch (error) {

        console.error(
            "Load events error:",
            error
        );


        eventList.innerHTML =
            '<p class="error">Could not load events.</p>';

    }

}


// =================================================
// CREATE EVENT ITEM
// =================================================

function createEventItem(
    id,
    data
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "event-item";


    // =============================================
    // TITLE
    // =============================================

    const title =
        document.createElement(
            "h3"
        );


    title.textContent =
        data.name ||
        "Untitled Event";


    // =============================================
    // DATE
    // =============================================

    const date =
        document.createElement(
            "p"
        );


    date.className =
        "event-date";


    date.textContent =
        "📅 " +
        formatDate(
            data.date
        );


    // =============================================
    // DESCRIPTION
    // =============================================

    const description =
        document.createElement(
            "p"
        );


    description.className =
        "event-description";


    description.textContent =
        data.description ||
        "No description.";


    // =============================================
    // ACTIONS
    // =============================================

    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "event-actions";


    // VIEW

    const view =
        document.createElement(
            "a"
        );


    view.className =
        "view-button";


    view.textContent =
        "👁️ View Event";


    view.href =
        "../events/event.html?id=" +
        encodeURIComponent(
            id
        );


    view.target =
        "_blank";


    // EDIT

    const edit =
        document.createElement(
            "button"
        );


    edit.type =
        "button";


    edit.className =
        "edit-button";


    edit.textContent =
        "✏️ Edit";


    edit.onclick =
        function() {

            editEvent(
                id,
                data
            );

        };


    // DELETE

    const remove =
        document.createElement(
            "button"
        );


    remove.type =
        "button";


    remove.className =
        "delete-button";


    remove.textContent =
        "🗑️ Delete";


    remove.onclick =
        function() {

            deleteEvent(
                id,
                data.name
            );

        };


    actions.appendChild(
        view
    );


    actions.appendChild(
        edit
    );


    actions.appendChild(
        remove
    );


    // =============================================
    // MEDIA UPLOAD BOX
    // =============================================

    const mediaBox =
        createMediaUploadBox();


    // =============================================
    // APPEND
    // =============================================

    item.appendChild(
        title
    );

    item.appendChild(
        date
    );

    item.appendChild(
        description
    );

    item.appendChild(
        actions
    );

    item.appendChild(
        mediaBox
    );


    eventList.appendChild(
        item
    );


    setupMediaUpload(
        mediaBox,
        id
    );


}


// =================================================
// CREATE MEDIA UPLOAD BOX
// =================================================

function createMediaUploadBox() {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "media-upload-box";


    box.innerHTML = `

        <h4>
            📁 Event Photos &amp; Videos
        </h4>

        <p class="media-help">
            Select photos or videos directly
            from your computer using File Explorer.
        </p>


        <div class="media-upload-partitions">


            <!-- ==============================
                 PHOTOS
            =============================== -->

            <div class="media-partition photo-partition">

                <h5>
                    📷 Event Photos
                </h5>

                <p>
                    Select JPG, JPEG, PNG,
                    WEBP or GIF images.
                </p>

                <input
                    type="file"
                    class="media-file-input photo-file-input"
                    accept=".jpg,.jpeg,.png,.webp,.gif"
                    multiple
                >

                <button
                    type="button"
                    class="media-upload-button photo-upload-button"
                >

                    📤 Upload Photos

                </button>

                <div
                    class="media-status photo-status"
                ></div>

            </div>


            <!-- ==============================
                 VIDEOS
            =============================== -->

            <div class="media-partition video-partition">

                <h5>
                    🎥 Event Videos
                </h5>

                <p>
                    Select MP4, WEBM, MOV
                    or M4V videos.
                </p>

                <input
                    type="file"
                    class="media-file-input video-file-input"
                    accept=".mp4,.webm,.mov,.m4v"
                    multiple
                >

                <button
                    type="button"
                    class="media-upload-button video-upload-button"
                >

                    📤 Upload Videos

                </button>

                <div
                    class="media-status video-status"
                ></div>

            </div>


        </div>


        <div class="media-count">

            <span class="photo-count">
                📷 Photos: 0
            </span>

            <span class="video-count">
                🎥 Videos: 0
            </span>

        </div>

    `;


    return box;

}


// =================================================
// SETUP MEDIA UPLOAD
// =================================================

function setupMediaUpload(
    box,
    eventId
) {


    const photoInput =
        box.querySelector(
            ".photo-file-input"
        );


    const videoInput =
        box.querySelector(
            ".video-file-input"
        );


    const photoButton =
        box.querySelector(
            ".photo-upload-button"
        );


    const videoButton =
        box.querySelector(
            ".video-upload-button"
        );


    const photoStatus =
        box.querySelector(
            ".photo-status"
        );


    const videoStatus =
        box.querySelector(
            ".video-status"
        );


    const photoCount =
        box.querySelector(
            ".photo-count"
        );


    const videoCount =
        box.querySelector(
            ".video-count"
        );


    // =============================================
    // PHOTO UPLOAD
    // =============================================

    photoButton.addEventListener(
        "click",
        async function() {

            const files =
                photoInput.files;


            if (
                !files ||
                files.length === 0
            ) {

                photoStatus.textContent =
                    "Please select photo files first.";

                photoStatus.className =
                    "media-status error";

                return;

            }


            await uploadFiles(
                files,
                "photo",
                photoStatus,
                photoButton,
                eventId
            );



            await updateMediaCount(
                "photo",
                photoCount
            );


            photoInput.value =
                "";

        }
    );


    // =============================================
    // VIDEO UPLOAD
    // =============================================

    videoButton.addEventListener(
        "click",
        async function() {

            const files =
                videoInput.files;


            if (
                !files ||
                files.length === 0
            ) {

                videoStatus.textContent =
                    "Please select video files first.";

                videoStatus.className =
                    "media-status error";

                return;

            }


            await uploadFiles(
                files,
                "video",
                videoStatus,
                videoButton,
                eventId
            );


            await updateMediaCount(
                "video",
                videoCount
            );


            videoInput.value =
                "";

        }
    );


    // =============================================
    // INITIAL COUNTS
    // =============================================

    updateMediaCount(
        "photo",
        photoCount
    );


    updateMediaCount(
        "video",
        videoCount
    );

}


// =================================================
// UPLOAD FILES
// =================================================

async function uploadFiles(
    files,
    type,
    statusElement,
    buttonElement,
    eventID
) {

    const user =
        auth.currentUser;


    // =============================================
    // ADMIN CHECK
    // =============================================

    if (
        !await verifyAdmin(user)
    ) {

        statusElement.textContent =
            "You are not authorized.";

        statusElement.className =
            "media-status error";

        return;

    }


    buttonElement.disabled =
        true;


    buttonElement.textContent =
        "Uploading...";


    let uploaded =
        0;


    let failed =
        0;


    // =============================================
    // CORRECT BACKEND ENDPOINT
    // =============================================

    const endpoint =
        type === "photo"
            ? "/api/upload/photos"
            : "/api/upload/videos";


    // =============================================
    // CORRECT MULTER FIELD NAME
    // =============================================

    const fieldName =
        type === "photo"
            ? "photos"
            : "videos";


    console.log(
        "Upload endpoint:",
        API_URL + endpoint
    );


    console.log(
        "Upload field:",
        fieldName
    );


    // =============================================
    // UPLOAD EACH FILE
    // =============================================

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];


        const formData =
            new FormData();


        // IMPORTANT:
        // Backend expects "photos" or "videos".

        formData.append(
            fieldName,
            file
        );

        formData.append(
            "eventId",
            eventId
        );

        try {

            console.log(
                "Uploading file:",
                file.name
            );


            const response =
                await fetch(
                    API_URL + endpoint,
                    {
                        method:
                            "POST",

                        body:
                            formData
                    }
                );


            const responseText =
                await response.text();


            let result;


            try {

                result =
                    JSON.parse(
                        responseText
                    );

            } catch (jsonError) {

                console.error(
                    "Invalid server response:",
                    responseText
                );


                throw new Error(
                    "Server returned invalid response. HTTP " +
                    response.status
                );

            }


            if (
                !response.ok
            ) {

                throw new Error(
                    result.message ||
                    "Upload failed."
                );

            }


            console.log(
                "Upload successful:",
                result
            );


            uploaded++;


        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            failed++;

        }

    }


    // =============================================
    // DISPLAY STATUS
    // =============================================

    if (
        failed === 0
    ) {

        statusElement.textContent =
            `✅ ${uploaded} ${
                type === "photo"
                    ? "photo"
                    : "video"
            } file(s) uploaded successfully.`;


        statusElement.className =
            "media-status success";


    } else {

        statusElement.textContent =
            `⚠️ ${uploaded} uploaded, ${failed} failed.`;


        statusElement.className =
            "media-status error";

    }


    // =============================================
    // RESET BUTTON
    // =============================================

    buttonElement.disabled =
        false;


    buttonElement.textContent =
        type === "photo"
            ? "📤 Upload Photos"
            : "📤 Upload Videos";

}


// =================================================
// UPDATE MEDIA COUNT
// =================================================

async function updateMediaCount(
    type,
    element
) {

    try {

        // =========================================
        // CORRECT LIST ENDPOINT
        // =========================================

        const endpoint =
            type === "photo"
                ? "/api/upload/photos"
                : "/api/upload/videos";


        const response =
            await fetch(
                API_URL +
                endpoint
            );


        if (
            !response.ok
        ) {

            console.error(
                "Media count request failed:",
                response.status
            );

            return;

        }


        const files =
            await response.json();


        if (
            !Array.isArray(files)
        ) {

            console.error(
                "Invalid media list response:",
                files
            );

            return;

        }


        element.textContent =
            type === "photo"
                ? "📷 Photos: " +
                  files.length
                : "🎥 Videos: " +
                  files.length;


    } catch (error) {

        console.error(
            "Could not update media count:",
            error
        );

    }

}


// =================================================
// EDIT EVENT
// =================================================

function editEvent(
    id,
    data
) {

    eventName.value =
        data.name || "";


    eventDate.value =
        data.date || "";


    eventDescription.value =
        data.description || "";


    eventForm.setAttribute(
        "data-edit-id",
        id
    );


    saveEventButton.textContent =
        "💾 Update Event";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// =================================================
// DELETE EVENT
// =================================================

async function deleteEvent(
    id,
    name
) {

    const user =
        auth.currentUser;


    if (
        !await verifyAdmin(user)
    ) {

        alert(
            "You are not authorized."
        );

        return;

    }


    const confirmed =
        window.confirm(

            'Are you sure you want to delete "' +
            (
                name ||
                "this event"
            ) +
            '"?'

        );


    if (!confirmed) {

        return;

    }


    try {

        await db
            .collection(
                EVENTS_COLLECTION
            )
            .doc(id)
            .delete();


        await loadEvents();


        alert(
            "Event deleted successfully."
        );


    } catch (error) {

        console.error(
            "Delete event error:",
            error
        );


        alert(
            "Could not delete the event."
        );

    }

}


// =================================================
// FORMAT DATE
// =================================================

function formatDate(
    dateString
) {

    if (!dateString) {

        return "Date not available";

    }


    const date =
        new Date(
            dateString +
            "T00:00:00"
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return dateString;

    }


    return date.toLocaleDateString(
        "en-IN",
        {

            day:
                "numeric",

            month:
                "long",

            year:
                "numeric"

        }
    );

}
