<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ADTU Bodo Union | Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .admin-header h1 {
            margin: 0 0 8px;
        }

        .admin-user {
            color: #666;
            margin: 0;
        }

        .logout-button {
            background: #c62828;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.08);
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .primary-button {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .secondary-button {
            background: #eee;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 8px;
        }

        .event-list {
            display: grid;
            gap: 15px;
        }

        .event-item {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 18px;
        }

        .event-item h3 {
            margin-top: 0;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .edit-button {
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-button {
            background: #c62828;
            color: #fff;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .status-message {
            margin-top: 15px;
            min-height: 20px;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #c62828;
        }

        .loading {
            color: #666;
        }

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <div class="nav-container">

        <a
            href="../index.html"
            class="brand">

            <div class="brand-logo">
                ABU
            </div>

            <div class="brand-text">

                <strong>
                    ADTU BODO UNION
                </strong>

                <span>
                    Event &amp; Photo Hub
                </span>

            </div>

        </a>

    </div>

</header>


<main class="admin-page">


    <!-- ADMIN HEADER -->

    <section class="admin-header">

        <div>

            <h1>
                🔐 Admin Dashboard
            </h1>

            <p
                id="adminUser"
                class="admin-user">
                Checking admin access...
            </p>

        </div>


        <button
            id="logoutButton"
            class="logout-button">

            🚪 Logout

        </button>

    </section>


    <!-- ADD EVENT -->

    <section class="admin-card">

        <h2>
            Add Event
        </h2>

        <p>
            Create a new ADTU Bodo Union event.
        </p>


        <form id="eventForm">


            <div class="form-group">

                <label for="eventName">
                    Event Name
                </label>

                <input
                    id="eventName"
                    type="text"
                    placeholder="Enter event name"
                    required>

            </div>


            <div class="form-group">

                <label for="eventDate">
                    Event Date
                </label>

                <input
                    id="eventDate"
                    type="date"
                    required>

            </div>


            <div class="form-group">

                <label for="eventDescription">
                    Description
                </label>

                <textarea
                    id="eventDescription"
                    placeholder="Enter event description"></textarea>

            </div>


            <div class="form-group">

                <label for="photosLink">
                    Photos Link
                </label>

                <input
                    id="photosLink"
                    type="url"
                    placeholder="https://drive.google.com/...">

            </div>


            <div class="form-group">

                <label for="videosLink">
                    Videos Link
                </label>

                <input
                    id="videosLink"
                    type="url"
                    placeholder="https://drive.google.com/...">

            </div>


            <button
                id="saveEventButton"
                type="submit"
                class="primary-button">

                ➕ Add Event

            </button>


            <button
                id="clearFormButton"
                type="button"
                class="secondary-button">

                Clear

            </button>


            <div
                id="formMessage"
                class="status-message">
            </div>


        </form>

    </section>


    <!-- EVENTS -->

    <section class="admin-card">

        <h2>
            Manage Events
        </h2>

        <div
            id="eventList"
            class="event-list">

            <p class="loading">
                Loading events...
            </p>

        </div>

    </section>


</main>


<footer>

    <div class="footer-container">

        <div>

            <strong>
                ADTU BODO UNION
            </strong>

            <p>
                Event &amp; Photo Hub
            </p>

        </div>

        <p>
            ©
            <span id="year"></span>
            ADTU Bodo Union
        </p>

    </div>

</footer>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../js/firebase.js"></script>


<script>

    const eventForm =
        document.getElementById("eventForm");

    const eventName =
        document.getElementById("eventName");

    const eventDate =
        document.getElementById("eventDate");

    const eventDescription =
        document.getElementById("eventDescription");

    const photosLink =
        document.getElementById("photosLink");

    const videosLink =
        document.getElementById("videosLink");

    const eventList =
        document.getElementById("eventList");

    const adminUser =
        document.getElementById("adminUser");

    const logoutButton =
        document.getElementById("logoutButton");

    const formMessage =
        document.getElementById("formMessage");

    const saveEventButton =
        document.getElementById("saveEventButton");

    const clearFormButton =
        document.getElementById("clearFormButton");

    const yearElement =
        document.getElementById("year");


    if (yearElement) {

        yearElement.textContent =
            new Date().getFullYear();

    }


    // =====================================
    // ADMIN CHECK
    // =====================================

    async function verifyAdmin(user) {

        if (!user) {
            return false;
        }


        try {

            const adminDoc =
                await db
                    .collection("admins")
                    .doc(user.uid)
                    .get();


            if (!adminDoc.exists) {
                return false;
            }


            const data =
                adminDoc.data();


            if (
                data.role &&
                data.role !== "admin"
            ) {
                return false;
            }


            return true;

        } catch (error) {

            console.error(
                "Admin verification failed:",
                error
            );

            return false;

        }

    }


    // =====================================
    // PROTECT DASHBOARD
    // =====================================

    auth.onAuthStateChanged(
        async function(user) {

            if (!user) {

                window.location.replace(
                    "login.html"
                );

                return;

            }


            const admin =
                await verifyAdmin(user);


            if (!admin) {

                await auth.signOut();

                window.location.replace(
                    "login.html"
                );

                return;

            }


            adminUser.textContent =
                "Logged in as: " +
                (user.email || "Administrator");


            loadEvents();

        }
    );


    // =====================================
    // LOGOUT
    // =====================================

    logoutButton.addEventListener(
        "click",
        async function() {

            try {

                await auth.signOut();

                window.location.replace(
                    "login.html"
                );

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }

        }
    );


    // =====================================
    // CLEAR FORM
    // =====================================

    function clearForm() {

        eventForm.reset();

        saveEventButton.textContent =
            "➕ Add Event";

        formMessage.textContent = "";

        eventForm.removeAttribute(
            "data-edit-id"
        );

    }


    clearFormButton.addEventListener(
        "click",
        clearForm
    );


    // =====================================
    // ADD / UPDATE EVENT
    // =====================================

    eventForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const user =
                auth.currentUser;


            if (!await verifyAdmin(user)) {

                alert(
                    "You are not authorized to manage events."
                );

                return;

            }


            const data = {

                name:
                    eventName.value.trim(),

                date:
                    eventDate.value,

                description:
                    eventDescription.value.trim(),

                photosLink:
                    photosLink.value.trim(),

                videosLink:
                    videosLink.value.trim(),

                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            };


            if (!data.name || !data.date) {

                formMessage.textContent =
                    "Event name and date are required.";

                formMessage.className =
                    "status-message error";

                return;

            }


            const editId =
                eventForm.getAttribute(
                    "data-edit-id"
                );


            saveEventButton.disabled =
                true;


            saveEventButton.textContent =
                editId
                    ? "Updating..."
                    : "Adding...";


            try {

                if (editId) {

                    await db
                        .collection("events")
                        .doc(editId)
                        .update(data);

                    formMessage.textContent =
                        "Event updated successfully.";

                } else {

                    data.createdAt =
                        firebase.firestore.FieldValue
                            .serverTimestamp();

                    await db
                        .collection("events")
                        .add(data);

                    formMessage.textContent =
                        "Event added successfully.";

                }


                formMessage.className =
                    "status-message success";


                clearForm();

                await loadEvents();


            } catch (error) {

                console.error(
                    "Could not save event:",
                    error
                );


                formMessage.textContent =
                    "Could not save the event.";

                formMessage.className =
                    "status-message error";

            }


            saveEventButton.disabled =
                false;

        }
    );


    // =====================================
    // LOAD EVENTS
    // =====================================

    async function loadEvents() {

        eventList.innerHTML =
            '<p class="loading">Loading events...</p>';


        try {

            const snapshot =
                await db
                    .collection("events")
                    .orderBy(
                        "date",
                        "desc"
                    )
                    .get();


            if (snapshot.empty) {

                eventList.innerHTML =
                    "<p>No events found.</p>";

                return;

            }


            eventList.innerHTML = "";


            snapshot.forEach(
                function(doc) {

                    const data =
                        doc.data();


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "event-item";


                    const title =
                        document.createElement(
                            "h3"
                        );

                    title.textContent =
                        data.name ||
                        "Untitled Event";


                    const date =
                        document.createElement(
                            "p"
                        );

                    date.textContent =
                        data.date ||
                        "";


                    const description =
                        document.createElement(
                            "p"
                        );

                    description.textContent =
                        data.description ||
                        "";


                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "event-actions";


                    const view =
                        document.createElement(
                            "a"
                        );

                    view.href =
                        "../events/event.html?id=" +
                        encodeURIComponent(
                            doc.id
                        );

                    view.textContent =
                        "View Event";


                    const edit =
                        document.createElement(
                            "button"
                        );

                    edit.className =
                        "edit-button";

                    edit.textContent =
                        "✏️ Edit";


                    edit.addEventListener(
                        "click",
                        function() {

                            editEvent(
                                doc.id,
                                data
                            );

                        }
                    );


                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.className =
                        "delete-button";

                    deleteButton.textContent =
                        "🗑️ Delete";


                    deleteButton.addEventListener(
                        "click",
                        function() {

                            deleteEvent(
                                doc.id,
                                data.name
                            );

                        }
                    );


                    actions.appendChild(view);

                    actions.appendChild(edit);

                    actions.appendChild(
                        deleteButton
                    );


                    item.appendChild(title);

                    item.appendChild(date);

                    item.appendChild(
                        description
                    );

                    item.appendChild(actions);


                    eventList.appendChild(item);

                }
            );


        } catch (error) {

            console.error(
                "Could not load events:",
                error
            );


            eventList.innerHTML =
                "<p class='error'>Could not load events.</p>";

        }

    }


    // =====================================
    // EDIT EVENT
    // =====================================

    function editEvent(
        id,
        data
    ) {

        eventName.value =
            data.name || "";

        eventDate.value =
            data.date || "";

        eventDescription.value =
            data.description || "";

        photosLink.value =
            data.photosLink || "";

        videosLink.value =
            data.videosLink || "";


        eventForm.setAttribute(
            "data-edit-id",
            id
        );


        saveEventButton.textContent =
            "💾 Update Event";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    // =====================================
    // DELETE EVENT
    // =====================================

    async function deleteEvent(
        id,
        name
    ) {

        const user =
            auth.currentUser;


        if (!await verifyAdmin(user)) {

            alert(
                "You are not authorized to delete this event."
            );

            return;

        }


        const confirmed =
            window.confirm(
                `Are you sure you want to delete "${name || "this event"}"?`
            );


        if (!confirmed) {
            return;
        }


        try {

            await db
                .collection("events")
                .doc(id)
                .delete();


            alert(
                "Event deleted successfully."
            );


            await loadEvents();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                "Could not delete the event."
            );

        }

    }

</script>

</body>

</html>
