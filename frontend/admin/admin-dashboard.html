<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ADTU Bodo Union | Admin Dashboard</title>

    <!-- Main Stylesheet -->
    <link
        rel="stylesheet"
        href="../css/style.css">

    <!-- =========================
         ADMIN DASHBOARD CSS
    ========================== -->
    <style>
        /* =========================
           ADMIN PAGE
        ========================== */

        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header,
        .admin-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           ADMIN HEADER
        ========================== */

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
        }

        .admin-user {
            color: #666;
            margin: 0;
        }

        .logout-button {
            background: #c62828;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-button:hover {
            background: #a91f1f;
        }

        /* =========================
           ADMIN CARD
        ========================== */

        .admin-card {
            padding: 30px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        /* =========================
           FORM
        ========================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* =========================
           BUTTONS
        ========================== */

        .primary-button {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .primary-button:hover {
            background: #1558b0;
        }

        .primary-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #eee;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 8px;
        }

        /* =========================
           EVENT LIST
        ========================== */

        .event-list {
            display: grid;
            gap: 18px;
        }

        .event-item {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
        }

        .event-item h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .event-date {
            color: #666;
        }

        .event-description {
            line-height: 1.6;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* =========================
           EVENT ACTION BUTTONS
        ========================== */

        .view-button,
        .edit-button,
        .delete-button {
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .view-button {
            background: #2563eb;
            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
        }

        .delete-button {
            background: #c62828;
            color: white;
        }

        /* =========================
           GOOGLE DRIVE MEDIA BOX
        ========================== */

        .drive-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9ff;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .drive-box h4 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .drive-help {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .drive-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .drive-group {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
        }

        .drive-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .drive-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        .drive-button {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 9px 13px;
            border-radius: 7px;
            font-weight: 600;
            background: #188038;
        }

        .drive-button.disabled {
            background: #aaa;
            pointer-events: none;
        }

        /* =========================
           MEDIA COUNTS
        ========================== */

        .media-count {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding: 14px;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            font-weight: 700;
        }

        .photo-count {
            color: #7b1fa2;
        }

        .video-count {
            color: #00897b;
        }

        /* =========================
           STATUS MESSAGES
        ========================== */

        .drive-status {
            margin-top: 15px;
            min-height: 22px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-message {
            min-height: 20px;
            margin-top: 15px;
        }

        .success {
            color: #2e7d32;
        }

        .error {
            color: #c62828;
        }

        .loading {
            color: #666;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media (max-width: 700px) {

            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header button {
                width: 100%;
            }

            .drive-grid {
                grid-template-columns: 1fr;
            }

            .secondary-button {
                margin-left: 0;
                margin-top: 10px;
            }

            .media-count {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="../index.html"
                class="brand">

                <div class="brand-logo">
                    ABU
                </div>

                <div class="brand-text">

                    <strong>
                        ADTU BODO UNION
                    </strong>

                    <span>
                        Event &amp; Photo Hub
                    </span>

                </div>

            </a>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="admin-page">

        <!-- =========================
             ADMIN HEADER
        ========================== -->

        <section class="admin-header">

            <div>

                <h1>
                    🔐 Admin Dashboard
                </h1>

                <p
                    id="adminUser"
                    class="admin-user">

                    Checking admin access...

                </p>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
                type="button">

                🚪 Logout

            </button>

        </section>


        <!-- =========================
             ADD EVENT
        ========================== -->

        <section class="admin-card">

            <h2>
                Add Event
            </h2>

            <p>
                Create a new ADTU Bodo Union event.
            </p>

            <form id="eventForm">

                <!-- Event Name -->

                <div class="form-group">

                    <label for="eventName">
                        Event Name
                    </label>

                    <input
                        id="eventName"
                        type="text"
                        placeholder="Enter event name"
                        required>

                </div>


                <!-- Event Date -->

                <div class="form-group">

                    <label for="eventDate">
                        Event Date
                    </label>

                    <input
                        id="eventDate"
                        type="date"
                        required>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="eventDescription">
                        Description
                    </label>

                    <textarea
                        id="eventDescription"
                        placeholder="Enter event description">
                    </textarea>

                </div>


                <!-- Photos Drive Link -->

                <div class="form-group">

                    <label for="photosLink">
                        📷 Google Drive Photos Folder
                    </label>

                    <input
                        id="photosLink"
                        type="url"
                        placeholder="Paste Google Drive photos folder link">

                </div>


                <!-- Videos Drive Link -->

                <div class="form-group">

                    <label for="videosLink">
                        🎥 Google Drive Videos Folder
                    </label>

                    <input
                        id="videosLink"
                        type="url"
                        placeholder="Paste Google Drive videos folder link">

                </div>


                <!-- Photo Count -->

                <div class="form-group">

                    <label for="photoCount">
                        📷 Number of Photos
                    </label>

                    <input
                        id="photoCount"
                        type="number"
                        min="0"
                        value="0"
                        placeholder="Example: 25">

                </div>


                <!-- Video Count -->

                <div class="form-group">

                    <label for="videoCount">
                        🎥 Number of Videos
                    </label>

                    <input
                        id="videoCount"
                        type="number"
                        min="0"
                        value="0"
                        placeholder="Example: 4">

                </div>


                <!-- Form Buttons -->

                <button
                    id="saveEventButton"
                    type="submit"
                    class="primary-button">

                    ➕ Add Event

                </button>

                <button
                    id="clearFormButton"
                    type="button"
                    class="secondary-button">

                    Clear

                </button>


                <!-- Form Status -->

                <div
                    id="formMessage"
                    class="status-message">
                </div>

            </form>

        </section>


        <!-- =========================
             MANAGE EVENTS
        ========================== -->

        <section class="admin-card">

            <h2>
                Manage Events
            </h2>

            <div
                id="eventList"
                class="event-list">

                <p class="loading">
                    Loading events...
                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-container">

            <div>

                <strong>
                    ADTU BODO UNION
                </strong>

                <p>
                    Event &amp; Photo Hub
                </p>

            </div>

            <p>

                ©
                <span id="year"></span>
                ADTU Bodo Union

            </p>

        </div>

    </footer>


    <!-- =========================
         FIREBASE APP
    ========================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="../js/firebase.js"></script>


    <!-- =========================
         ADMIN DASHBOARD JAVASCRIPT
    ========================== -->

    <script>

        // =====================================
        // DOM ELEMENTS
        // =====================================

        const eventForm =
            document.getElementById("eventForm");

        const eventName =
            document.getElementById("eventName");

        const eventDate =
            document.getElementById("eventDate");

        const eventDescription =
            document.getElementById("eventDescription");

        const photosLink =
            document.getElementById("photosLink");

        const videosLink =
            document.getElementById("videosLink");

        const photoCount =
            document.getElementById("photoCount");

        const videoCount =
            document.getElementById("videoCount");

        const eventList =
            document.getElementById("eventList");

        const adminUser =
            document.getElementById("adminUser");

        const logoutButton =
            document.getElementById("logoutButton");

        const formMessage =
            document.getElementById("formMessage");

        const saveEventButton =
            document.getElementById("saveEventButton");

        const clearFormButton =
            document.getElementById("clearFormButton");

        const yearElement =
            document.getElementById("year");


        // =====================================
        // FOOTER YEAR
        // =====================================

        yearElement.textContent =
            new Date().getFullYear();


        // =====================================
        // ADMIN CHECK
        // =====================================

        async function verifyAdmin(user) {

            if (!user) {
                return false;
            }

            try {

                const adminDoc =
                    await db
                        .collection("admins")
                        .doc(user.uid)
                        .get();

                if (!adminDoc.exists) {
                    return false;
                }

                const data =
                    adminDoc.data();

                return (
                    !data.role ||
                    data.role === "admin"
                );

            } catch (error) {

                console.error(
                    "Admin verification error:",
                    error
                );

                return false;
            }
        }


        // =====================================
        // AUTH STATE
        // =====================================

        auth.onAuthStateChanged(
            async function (user) {

                if (!user) {

                    window.location.replace(
                        "login.html"
                    );

                    return;
                }

                const admin =
                    await verifyAdmin(user);

                if (!admin) {

                    await auth.signOut();

                    window.location.replace(
                        "login.html"
                    );

                    return;
                }

                adminUser.textContent =
                    "Logged in as: " +
                    (
                        user.email ||
                        "Administrator"
                    );

                loadEvents();
            }
        );


        // =====================================
        // LOGOUT
        // =====================================

        logoutButton.addEventListener(
            "click",
            async function () {

                try {

                    await auth.signOut();

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );
                }

                window.location.replace(
                    "login.html"
                );
            }
        );


        // =====================================
        // CLEAR FORM
        // =====================================

        function clearForm() {

            eventForm.reset();

            eventForm.removeAttribute(
                "data-edit-id"
            );

            photoCount.value = "0";
            videoCount.value = "0";

            saveEventButton.textContent =
                "➕ Add Event";

            formMessage.textContent = "";

            formMessage.className =
                "status-message";
        }

        clearFormButton.addEventListener(
            "click",
            clearForm
        );


        // =====================================
        // ADD / UPDATE EVENT
        // =====================================

        eventForm.addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();

                const user =
                    auth.currentUser;

                if (!await verifyAdmin(user)) {

                    formMessage.textContent =
                        "You are not authorized.";

                    formMessage.className =
                        "status-message error";

                    return;
                }

                const data = {

                    name:
                        eventName.value.trim(),

                    date:
                        eventDate.value,

                    description:
                        eventDescription.value.trim(),

                    photosLink:
                        photosLink.value.trim(),

                    videosLink:
                        videosLink.value.trim(),

                    photoCount:
                        Math.max(
                            0,
                            Number(
                                photoCount.value
                            ) || 0
                        ),

                    videoCount:
                        Math.max(
                            0,
                            Number(
                                videoCount.value
                            ) || 0
                        ),

                    updatedAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()
                };


                // Validate required fields

                if (
                    !data.name ||
                    !data.date
                ) {

                    formMessage.textContent =
                        "Event name and date are required.";

                    formMessage.className =
                        "status-message error";

                    return;
                }


                const editId =
                    eventForm.getAttribute(
                        "data-edit-id"
                    );


                saveEventButton.disabled =
                    true;

                saveEventButton.textContent =
                    editId
                        ? "Updating..."
                        : "Adding...";


                try {

                    // UPDATE EVENT

                    if (editId) {

                        await db
                            .collection("events")
                            .doc(editId)
                            .update(data);

                        formMessage.textContent =
                            "Event updated successfully.";

                    }

                    // ADD EVENT

                    else {

                        data.createdAt =
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp();

                        await db
                            .collection("events")
                            .add(data);

                        formMessage.textContent =
                            "Event added successfully.";
                    }


                    formMessage.className =
                        "status-message success";

                    clearForm();

                    await loadEvents();

                } catch (error) {

                    console.error(
                        "Save error:",
                        error
                    );

                    formMessage.textContent =
                        "Could not save the event.";

                    formMessage.className =
                        "status-message error";
                }


                saveEventButton.disabled =
                    false;

                saveEventButton.textContent =
                    "➕ Add Event";
            }
        );


        // =====================================
        // LOAD EVENTS
        // =====================================

        async function loadEvents() {

            eventList.innerHTML =
                '<p class="loading">Loading events...</p>';

            try {

                const snapshot =
                    await db
                        .collection("events")
                        .orderBy(
                            "date",
                            "desc"
                        )
                        .get();

                eventList.innerHTML = "";

                if (snapshot.empty) {

                    eventList.innerHTML =
                        "<p>No events found.</p>";

                    return;
                }

                snapshot.forEach(
                    function (doc) {

                        createEventItem(
                            doc.id,
                            doc.data()
                        );
                    }
                );

            } catch (error) {

                console.error(
                    "Load events error:",
                    error
                );

                eventList.innerHTML =
                    '<p class="error">Could not load events.</p>';
            }
        }


        // =====================================
        // CREATE EVENT ITEM
        // =====================================

        function createEventItem(
            id,
            data
        ) {

            const item =
                document.createElement("div");

            item.className =
                "event-item";


            // ---------------------------------
            // TITLE
            // ---------------------------------

            const title =
                document.createElement("h3");

            title.textContent =
                data.name ||
                "Untitled Event";


            // ---------------------------------
            // DATE
            // ---------------------------------

            const date =
                document.createElement("p");

            date.className =
                "event-date";

            date.textContent =
                "📅 " +
                formatDate(data.date);


            // ---------------------------------
            // DESCRIPTION
            // ---------------------------------

            const description =
                document.createElement("p");

            description.className =
                "event-description";

            description.textContent =
                data.description ||
                "No description.";


            // ---------------------------------
            // ACTIONS
            // ---------------------------------

            const actions =
                document.createElement("div");

            actions.className =
                "event-actions";


            // VIEW BUTTON

            const viewButton =
                document.createElement("a");

            viewButton.className =
                "view-button";

            viewButton.textContent =
                "👁️ View Event";

            viewButton.href =
                "../events/event.html?id=" +
                encodeURIComponent(id);

            viewButton.target =
                "_blank";


            // EDIT BUTTON

            const editButton =
                document.createElement("button");

            editButton.type = "button";

            editButton.className =
                "edit-button";

            editButton.textContent =
                "✏️ Edit";

            editButton.addEventListener(
                "click",
                function () {

                    editEvent(
                        id,
                        data
                    );
                }
            );


            // DELETE BUTTON

            const deleteButton =
                document.createElement("button");

            deleteButton.type = "button";

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑️ Delete";

            deleteButton.addEventListener(
                "click",
                function () {

                    deleteEvent(
                        id,
                        data.name
                    );
                }
            );


            // ADD ACTION BUTTONS

            actions.appendChild(
                viewButton
            );

            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            // ADD EVENT CONTENT

            item.appendChild(
                title
            );

            item.appendChild(
                date
            );

            item.appendChild(
                description
            );

            item.appendChild(
                actions
            );


            // ---------------------------------
            // DRIVE MEDIA BOX
            // ---------------------------------

            createDriveBox(
                id,
                data,
                item
            );


            eventList.appendChild(
                item
            );
        }


        // =====================================
        // DRIVE MEDIA BOX
        // =====================================

        function createDriveBox(
            eventId,
            data,
            eventItem
        ) {

            const box =
                document.createElement("div");

            box.className =
                "drive-box";


            // TITLE

            const title =
                document.createElement("h4");

            title.textContent =
                "📁 Google Drive Media";


            // HELP TEXT

            const help =
                document.createElement("p");

            help.className =
                "drive-help";

            help.textContent =
                "Upload photos and videos directly to your Google Drive folders. No API or backend is required.";


            // GRID

            const grid =
                document.createElement("div");

            grid.className =
                "drive-grid";


            // =================================
            // PHOTOS
            // =================================

            const photosGroup =
                document.createElement("div");

            photosGroup.className =
                "drive-group";


            const photosLabel =
                document.createElement("label");

            photosLabel.textContent =
                "📷 Photos";


            const photosInput =
                document.createElement("input");

            photosInput.type =
                "url";

            photosInput.placeholder =
                "Google Drive photos folder";

            photosInput.value =
                data.photosLink || "";


            const photosOpen =
                document.createElement("a");

            photosOpen.className =
                "drive-button";

            photosOpen.textContent =
                "📂 Open Photos";


            if (data.photosLink) {

                photosOpen.href =
                    data.photosLink;

                photosOpen.target =
                    "_blank";

            } else {

                photosOpen.classList.add(
                    "disabled"
                );
            }


            photosGroup.appendChild(
                photosLabel
            );

            photosGroup.appendChild(
                photosInput
            );

            photosGroup.appendChild(
                photosOpen
            );


            // =================================
            // VIDEOS
            // =================================

            const videosGroup =
                document.createElement("div");

            videosGroup.className =
                "drive-group";


            const videosLabel =
                document.createElement("label");

            videosLabel.textContent =
                "🎥 Videos";


            const videosInput =
                document.createElement("input");

            videosInput.type =
                "url";

            videosInput.placeholder =
                "Google Drive videos folder";

            videosInput.value =
                data.videosLink || "";


            const videosOpen =
                document.createElement("a");

            videosOpen.className =
                "drive-button";

            videosOpen.textContent =
                "📂 Open Videos";


            if (data.videosLink) {

                videosOpen.href =
                    data.videosLink;

                videosOpen.target =
                    "_blank";

            } else {

                videosOpen.classList.add(
                    "disabled"
                );
            }


            videosGroup.appendChild(
                videosLabel
            );

            videosGroup.appendChild(
                videosInput
            );

            videosGroup.appendChild(
                videosOpen
            );


            grid.appendChild(
                photosGroup
            );

            grid.appendChild(
                videosGroup
            );


            // =================================
            // LOCAL COUNT INPUTS
            // =================================

            const photoCountValue =
                document.createElement("input");

            photoCountValue.type =
                "number";

            photoCountValue.min =
                "0";

            photoCountValue.value =
                Number(
                    data.photoCount
                ) || 0;

            photoCountValue.style.marginTop =
                "15px";

            photoCountValue.placeholder =
                "Photo count";


            const videoCountValue =
                document.createElement("input");

            videoCountValue.type =
                "number";

            videoCountValue.min =
                "0";

            videoCountValue.value =
                Number(
                    data.videoCount
                ) || 0;

            videoCountValue.style.marginTop =
                "15px";

            videoCountValue.placeholder =
                "Video count";


            photosGroup.appendChild(
                photoCountValue
            );

            videosGroup.appendChild(
                videoCountValue
            );


            // =================================
            // MEDIA COUNTS
            // =================================

            const count =
                document.createElement("div");

            count.className =
                "media-count";


            const photoCountElement =
                document.createElement("span");

            photoCountElement.className =
                "photo-count";

            photoCountElement.textContent =
                "📷 Photos: " +
                (
                    Number(
                        data.photoCount
                    ) || 0
                );


            const videoCountElement =
                document.createElement("span");

            videoCountElement.className =
                "video-count";

            videoCountElement.textContent =
                "🎥 Videos: " +
                (
                    Number(
                        data.videoCount
                    ) || 0
                );


            count.appendChild(
                photoCountElement
            );

            count.appendChild(
                videoCountElement
            );


            // =================================
            // SAVE MEDIA BUTTON
            // =================================

            const saveButton =
                document.createElement("button");

            saveButton.type =
                "button";

            saveButton.className =
                "primary-button";

            saveButton.style.marginTop =
                "15px";

            saveButton.textContent =
                "💾 Save Media Links & Counts";


            // STATUS

            const status =
                document.createElement("div");

            status.className =
                "drive-status";


            // =================================
            // SAVE DRIVE LINKS
            // =================================

            saveButton.addEventListener(
                "click",
                async function () {

                    const user =
                        auth.currentUser;

                    if (!await verifyAdmin(user)) {

                        status.textContent =
                            "You are not authorized.";

                        status.className =
                            "drive-status error";

                        return;
                    }


                    saveButton.disabled =
                        true;

                    saveButton.textContent =
                        "Saving...";


                    try {

                        const newPhotosLink =
                            photosInput.value.trim();

                        const newVideosLink =
                            videosInput.value.trim();

                        const newPhotoCount =
                            Math.max(
                                0,
                                Number(
                                    photoCountValue.value
                                ) || 0
                            );

                        const newVideoCount =
                            Math.max(
                                0,
                                Number(
                                    videoCountValue.value
                                ) || 0
                            );


                        await db
                            .collection("events")
                            .doc(eventId)
                            .update({

                                photosLink:
                                    newPhotosLink,

                                videosLink:
                                    newVideosLink,

                                photoCount:
                                    newPhotoCount,

                                videoCount:
                                    newVideoCount,

                                updatedAt:
                                    firebase.firestore
                                        .FieldValue
                                        .serverTimestamp()
                            });


                        status.textContent =
                            "✅ Media information saved.";

                        status.className =
                            "drive-status success";


                        // Update photos button

                        if (newPhotosLink) {

                            photosOpen.href =
                                newPhotosLink;

                            photosOpen.target =
                                "_blank";

                            photosOpen.classList.remove(
                                "disabled"
                            );

                        } else {

                            photosOpen.removeAttribute(
                                "href"
                            );

                            photosOpen.classList.add(
                                "disabled"
                            );
                        }


                        // Update videos button

                        if (newVideosLink) {

                            videosOpen.href =
                                newVideosLink;

                            videosOpen.target =
                                "_blank";

                            videosOpen.classList.remove(
                                "disabled"
                            );

                        } else {

                            videosOpen.removeAttribute(
                                "href"
                            );

                            videosOpen.classList.add(
                                "disabled"
                            );
                        }


                        // Update counts

                        photoCountElement.textContent =
                            "📷 Photos: " +
                            newPhotoCount;

                        videoCountElement.textContent =
                            "🎥 Videos: " +
                            newVideoCount;


                    } catch (error) {

                        console.error(
                            "Media save error:",
                            error
                        );

                        status.textContent =
                            "❌ Could not save media information.";

                        status.className =
                            "drive-status error";
                    }


                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "💾 Save Media Links & Counts";
                }
            );


            // =================================
            // APPEND DRIVE BOX
            // =================================

            box.appendChild(
                title
            );

            box.appendChild(
                help
            );

            box.appendChild(
                grid
            );

            box.appendChild(
                count
            );

            box.appendChild(
                saveButton
            );

            box.appendChild(
                status
            );

            eventItem.appendChild(
                box
            );
        }


        // =====================================
        // EDIT EVENT
        // =====================================

        function editEvent(
            id,
            data
        ) {

            eventName.value =
                data.name || "";

            eventDate.value =
                data.date || "";

            eventDescription.value =
                data.description || "";

            photosLink.value =
                data.photosLink || "";

            videosLink.value =
                data.videosLink || "";

            photoCount.value =
                Number(
                    data.photoCount
                ) || 0;

            videoCount.value =
                Number(
                    data.videoCount
                ) || 0;


            eventForm.setAttribute(
                "data-edit-id",
                id
            );


            saveEventButton.textContent =
                "💾 Update Event";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        // =====================================
        // DELETE EVENT
        // =====================================

        async function deleteEvent(
            id,
            name
        ) {

            const user =
                auth.currentUser;

            if (!await verifyAdmin(user)) {

                alert(
                    "You are not authorized."
                );

                return;
            }


            const confirmed =
                window.confirm(
                    'Are you sure you want to delete "' +
                    (
                        name ||
                        "this event"
                    ) +
                    '"?'
                );


            if (!confirmed) {
                return;
            }


            try {

                await db
                    .collection("events")
                    .doc(id)
                    .delete();


                alert(
                    "Event deleted successfully."
                );

                await loadEvents();

            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );

                alert(
                    "Could not delete the event."
                );
            }
        }


        // =====================================
        // FORMAT DATE
        // =====================================

        function formatDate(
            dateString
        ) {

            if (!dateString) {
                return "Date not available";
            }


            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );


            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return dateString;
            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );
        }

    </script>
