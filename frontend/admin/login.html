<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ADTU Bodo Union | Admin Login</title>

    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="../css/style.css">

    <style>

        /* ==================================================
           ADMIN LOGIN PAGE
        ================================================== */

        .admin-login-page {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .admin-login-card h1 {
            margin: 0 0 10px;
        }

        .admin-login-card p {
            margin: 0 0 25px;
            color: #666;
            line-height: 1.5;
        }

        .admin-login-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .admin-login-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-login-card input:focus {
            outline: none;
            border-color: #1f6feb;
            box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.10);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1f6feb;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .login-button:hover {
            background: #1558bd;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-message {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            border-radius: 7px;
            min-height: 20px;
            font-size: 14px;
        }

        .login-message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .login-message.success {
            background: #dcfce7;
            color: #166534;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <header class="navbar">

        <div class="nav-container">

            <a
                href="../index.html"
                class="brand">

                <div class="brand-logo">
                    ABU
                </div>

                <div class="brand-text">

                    <strong>
                        ADTU BODO UNION
                    </strong>

                    <span>
                        Event &amp; Photo Hub
                    </span>

                </div>

            </a>

        </div>

    </header>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <main>

        <section class="admin-login-page">

            <div class="admin-login-card">

                <h1>
                    🔐 Admin Login
                </h1>

                <p>
                    Only authorized administrators can access
                    the admin dashboard.
                </p>


                <!-- ==================================================
                     LOGIN FORM
                ================================================== -->

                <form id="adminLoginForm">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        id="adminEmail"
                        type="email"
                        placeholder="Admin email"
                        autocomplete="username"
                        required>


                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        id="adminPassword"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>


                    <button
                        id="loginButton"
                        type="submit"
                        class="login-button">

                        🔐 Login

                    </button>

                </form>


                <!-- ==================================================
                     LOGIN MESSAGE
                ================================================== -->

                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <!-- ==================================================
                     BACK TO WEBSITE
                ================================================== -->

                <a
                    href="../index.html"
                    class="back-link">

                    ← Back to website

                </a>

            </div>

        </section>

    </main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer>

        <div class="footer-container">

            <div>

                <strong>
                    ADTU BODO UNION
                </strong>

                <p>
                    Event &amp; Photo Hub
                </p>

            </div>

            <p>
                ©
                <span id="year"></span>
                ADTU Bodo Union
            </p>

        </div>

    </footer>


    <!-- ==================================================
         FIREBASE
    ================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- Firebase configuration -->
    <script src="../js/firebase.js"></script>


    <script>

        // ==================================================
        // DOM ELEMENTS
        // ==================================================

        const loginForm =
            document.getElementById("adminLoginForm");

        const emailInput =
            document.getElementById("adminEmail");

        const passwordInput =
            document.getElementById("adminPassword");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");

        const yearElement =
            document.getElementById("year");


        // ==================================================
        // YEAR
        // ==================================================

        if (yearElement) {

            yearElement.textContent =
                new Date().getFullYear();

        }


        // ==================================================
        // SHOW MESSAGE
        // ==================================================

        function showMessage(
            message,
            type = "error"
        ) {

            loginMessage.textContent =
                message;

            loginMessage.className =
                "login-message " + type;

        }


        // ==================================================
        // CLEAR MESSAGE
        // ==================================================

        function clearMessage() {

            loginMessage.textContent =
                "";

            loginMessage.className =
                "login-message";

        }


        // ==================================================
        // ADMIN LOGIN
        // ==================================================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearMessage();


                // Get email
                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                // Get password
                const password =
                    passwordInput.value;


                // Validate fields
                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;

                }


                // Disable login button
                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Checking admin access...";


                try {

                    // ==================================================
                    // FIREBASE AUTHENTICATION
                    // ==================================================

                    const credential =
                        await auth.signInWithEmailAndPassword(
                            email,
                            password
                        );


                    const user =
                        credential.user;


                    if (!user) {

                        throw new Error(
                            "Unable to get Firebase user."
                        );

                    }


                    // ==================================================
                    // CHECK ADMIN DOCUMENT
                    // ==================================================

                    const adminDocument =
                        await db
                            .collection("admins")
                            .doc(user.uid)
                            .get();


                    // Admin document does not exist
                    if (!adminDocument.exists) {

                        await auth.signOut();

                        showMessage(
                            "Access denied. This account is not an administrator."
                        );

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "🔐 Login";

                        return;

                    }


                    // ==================================================
                    // CHECK ADMIN ROLE
                    // ==================================================

                    const adminData =
                        adminDocument.data() || {};


                    if (
                        adminData.role &&
                        adminData.role.toLowerCase() !== "admin"
                    ) {

                        await auth.signOut();

                        showMessage(
                            "Access denied. Invalid administrator role."
                        );

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "🔐 Login";

                        return;

                    }


                    // ==================================================
                    // LOGIN SUCCESS
                    // ==================================================

                    showMessage(
                        "Login successful. Opening dashboard...",
                        "success"
                    );


                    loginButton.textContent =
                        "Opening dashboard...";


                    // Open admin dashboard
                    setTimeout(
                        function () {

                            window.location.replace(
                                "../admin/admin-dashboard.html"
                            );

                        },
                        300
                    );

                }


                // ==================================================
                // LOGIN ERROR
                // ==================================================

                catch (error) {

                    console.error(
                        "ADMIN LOGIN ERROR:",
                        error
                    );


                    switch (error.code) {

                        case "auth/invalid-email":

                            showMessage(
                                "Please enter a valid email address."
                            );

                            break;


                        case "auth/user-not-found":

                            showMessage(
                                "No administrator account was found with this email."
                            );

                            break;


                        case "auth/wrong-password":

                            showMessage(
                                "Incorrect password."
                            );

                            break;


                        case "auth/invalid-credential":

                            showMessage(
                                "Invalid email or password."
                            );

                            break;


                        case "auth/user-disabled":

                            showMessage(
                                "This account has been disabled."
                            );

                            break;


                        case "auth/too-many-requests":

                            showMessage(
                                "Too many login attempts. Please wait and try again."
                            );

                            break;


                        case "auth/network-request-failed":

                            showMessage(
                                "Network error. Please check your internet connection."
                            );

                            break;


                        default:

                            showMessage(
                                "Unable to login. Please try again."
                            );

                            console.error(
                                "Firebase error code:",
                                error.code
                            );

                    }


                    // Re-enable button
                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "🔐 Login";

                }

            }
        );


        // ==================================================
        // CHECK IF ALREADY LOGGED IN
        // ==================================================

        auth.onAuthStateChanged(
            async function (user) {

                // No logged-in user
                if (!user) {

                    return;

                }


                try {

                    // ==================================================
                    // CHECK ADMIN DOCUMENT
                    // ==================================================

                    const adminDocument =
                        await db
                            .collection("admins")
                            .doc(user.uid)
                            .get();


                    if (adminDocument.exists) {

                        const adminData =
                            adminDocument.data() || {};


                        // ==================================================
                        // CHECK ADMIN ROLE
                        // ==================================================

                        if (
                            !adminData.role ||
                            adminData.role.toLowerCase() === "admin"
                        ) {

                            window.location.replace(
                                "../admin/admin-dashboard.html"
                            );

                        }

                    }

                }

                catch (error) {

                    console.error(
                        "Existing admin check failed:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
