<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ADTU Bodo Union</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            color: #1e3a5f;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.8;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-top: -7px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .forgot-password a {
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="brand">
            <h1>ADTU Bodo Union</h1>
            <p>Sign in to your account</p>
        </div>

        <div id="message" class="message" role="alert" aria-live="polite"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your registered email"
                    autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="toggle-password"
                        aria-label="Show password">Show</button>
                </div>
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" id="loginButton" class="login-button">
                Login
            </button>
        </form>

        <div class="links">
            Don't have an account?
            <a href="register.html">Register here</a>
            <br>
            <a href="index.html">Back to Homepage</a>
        </div>
    </main>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <!-- Your existing Firebase configuration -->
    <script src="js/firebase.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const messageBox = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = "message " + type;
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        // Show or hide password
        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "Hide" : "Show";
            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );
        });

        // Login using Firebase Authentication
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            clearMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Please enter your email and password.", "error");
                return;
            }

            if (!window.auth) {
                showMessage(
                    "Authentication is unavailable. Please check your Firebase configuration.",
                    "error"
                );
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                await window.auth.signInWithEmailAndPassword(email, password);

                showMessage(
                    "Login successful! Redirecting to homepage...",
                    "success"
                );

                window.setTimeout(function () {
                    window.location.href = "index.html";
                }, 800);

            } catch (error) {
                console.error("Login error:", error.code, error.message);

                switch (error.code) {
                    case "auth/invalid-credential":
                    case "auth/invalid-login-credentials":
                    case "auth/user-not-found":
                    case "auth/wrong-password":
                        showMessage(
                            "Invalid email or password. Please check your details or register for an account.",
                            "error"
                        );
                        break;

                    case "auth/invalid-email":
                        showMessage(
                            "Please enter a valid email address.",
                            "error"
                        );
                        break;

                    case "auth/too-many-requests":
                        showMessage(
                            "Too many login attempts. Please wait and try again later.",
                            "error"
                        );
                        break;

                    case "auth/network-request-failed":
                        showMessage(
                            "Network error. Please check your internet connection.",
                            "error"
                        );
                        break;

                    case "auth/user-disabled":
                        showMessage(
                            "This account has been disabled. Please contact the administrator.",
                            "error"
                        );
                        break;

                    default:
                        showMessage(
                            "Login failed. Please try again.",
                            "error"
                        );
                }

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        // Send password-reset email
        document.getElementById("forgotPassword").addEventListener(
            "click",
            async function (event) {
                event.preventDefault();
                clearMessage();

                const email = emailInput.value.trim();

                if (!email) {
                    showMessage(
                        "Enter your email address first to reset your password.",
                        "error"
                    );
                    emailInput.focus();
                    return;
                }

                if (!window.auth) {
                    showMessage(
                        "Authentication is unavailable. Please check your Firebase configuration.",
                        "error"
                    );
                    return;
                }

                try {
                    await window.auth.sendPasswordResetEmail(email);

                    showMessage(
                        "If an account exists for this email, a password-reset email will be sent. Check your inbox and spam folder.",
                        "success"
                    );

                } catch (error) {
                    console.error("Password reset error:", error.code);

                    if (error.code === "auth/invalid-email") {
                        showMessage(
                            "Please enter a valid email address.",
                            "error"
                        );
                    } else if (error.code === "auth/too-many-requests") {
                        showMessage(
                            "Too many requests. Please try again later.",
                            "error"
                        );
                    } else {
                        showMessage(
                            "Unable to request a password reset right now. Please try again later.",
                            "error"
                        );
                    }
                }
            }
        );
    </script>
</body>

</html>
